<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" fill="none">
  <!-- Outer Obsidian Canvas -->
  <rect width="920" height="500" rx="12" fill="#0D0D10" stroke="#26262E" stroke-width="1"/>

  <!-- Top Header Bar -->
  <rect x="1" y="1" width="918" height="42" rx="11" fill="#141418"/>
  <line x1="0" y1="43" x2="920" y2="43" stroke="#26262E" stroke-width="1"/>

  <!-- Monochrome Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#26262E"/>
  <circle cx="40" cy="22" r="5" fill="#26262E"/>
  <circle cx="56" cy="22" r="5" fill="#3F3F46"/>

  <text x="80" y="26" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">solana-live-websocket -- live slot, fork &amp; leader stream</text>
  <text x="738" y="26" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">127.0.0.1:8080 /ws</text>

  <!-- Left Panel: Terminal + Live WebSocket NDJSON Frames -->
  <rect x="20" y="60" width="540" height="420" rx="8" fill="#141418" stroke="#26262E" stroke-width="1"/>
  <rect x="21" y="61" width="538" height="30" rx="7" fill="#1C1C22"/>
  <line x1="20" y1="91" x2="560" y2="91" stroke="#26262E" stroke-width="1"/>
  <text x="34" y="80" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">TERMINAL // LIVE WEBSOCKET FRAMES</text>
  <text x="448" y="80" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">seq #41 -&gt; #44</text>

  <!-- CLI Command Block -->
  <text x="34" y="116" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">$ solana-live-websocket serve --port 8080 --simulator</text>
  <text x="34" y="135" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">listening on http://127.0.0.1:8080  |  ws://127.0.0.1:8080/ws  |  ring=10000</text>
  <text x="34" y="153" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">$ websocat "ws://127.0.0.1:8080/ws?since_seq=40"</text>

  <line x1="34" y1="166" x2="546" y2="166" stroke="#26262E" stroke-width="1"/>

  <!-- Frame 1: slot_update -->
  <rect x="34" y="176" width="512" height="64" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="46" y="195" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">event_type: "slot_update"</text>
  <text x="380" y="195" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">seq: 41  |  slot: 1000042</text>
  <text x="46" y="213" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">{"type":"event","event":{"sequence":41,"slot":1000042,"parent_slot":1000041,</text>
  <text x="46" y="229" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5"> "event_type":"slot_update","payload":{"target_duration_ms":200}}}</text>

  <!-- Frame 2: fork_detected -->
  <rect x="34" y="248" width="512" height="64" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="46" y="267" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">event_type: "fork_detected"</text>
  <text x="380" y="267" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">seq: 42  |  bank_id: 2</text>
  <text x="46" y="285" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">{"type":"event","event":{"sequence":42,"slot":1000042,"bank_id":2,</text>
  <text x="46" y="301" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5"> "event_type":"fork_detected","payload":{"cleared_bank_id":1,"state":"CANONICAL"}}}</text>

  <!-- Frame 3: leader_handoff -->
  <rect x="34" y="320" width="512" height="64" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="46" y="339" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">event_type: "leader_handoff"</text>
  <text x="380" y="339" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">seq: 43  |  window: 38ms</text>
  <text x="46" y="357" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">{"type":"event","event":{"sequence":43,"slot":1000042,"event_type":"leader_handoff",</text>
  <text x="46" y="373" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5"> "payload":{"leader":"ValidatorAlpha111...","handoff":"HANDOVER_IMMINENT"}}}</text>

  <!-- Frame 4: replay_ring -->
  <rect x="34" y="392" width="512" height="72" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="46" y="411" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">replay_ring // ?since_seq=40</text>
  <text x="380" y="411" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">seq: 44  |  0 missed</text>
  <text x="46" y="429" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">{"type":"replay_complete","since_seq":40,"replayed_count":4,"latest_seq":44}</text>
  <text x="46" y="447" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">{"type":"heartbeat","sequence":44,"slot":1000042,"ws_clients":3}</text>

  <!-- Right Panel: Axum Architecture Flow -->
  <rect x="576" y="60" width="324" height="420" rx="8" fill="#141418" stroke="#26262E" stroke-width="1"/>
  <rect x="577" y="61" width="322" height="30" rx="7" fill="#1C1C22"/>
  <line x1="576" y1="91" x2="900" y2="91" stroke="#26262E" stroke-width="1"/>
  <text x="590" y="80" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">AXUM STREAM PIPELINE</text>

  <!-- Stage 1 -->
  <rect x="594" y="108" width="288" height="62" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="608" y="128" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">1. Multi-Source Ingest</text>
  <text x="608" y="146" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Solana RPC + PubSub WS</text>
  <text x="608" y="160" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Validator UDS + Offline Simulator</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="738" y1="170" x2="738" y2="190" stroke="#3F3F46" stroke-width="1.5"/>
  <polygon points="734,186 742,186 738,193" fill="#3F3F46"/>

  <!-- Stage 2 -->
  <rect x="594" y="194" width="288" height="68" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="608" y="214" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">2. LiveStateEngine (RAM)</text>
  <text x="608" y="232" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">SlotClock (200ms) + LeaderEngine</text>
  <text x="608" y="248" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">BankGraph Forks + UpdateParent</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="738" y1="262" x2="738" y2="282" stroke="#3F3F46" stroke-width="1.5"/>
  <polygon points="734,278 742,278 738,285" fill="#3F3F46"/>

  <!-- Stage 3 -->
  <rect x="594" y="286" width="288" height="62" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="608" y="306" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">3. Bounded Replay Ring</text>
  <text x="608" y="324" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">10,000 seq ring  |  replay_since(N)</text>
  <text x="608" y="338" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Auto Lagged Snapshot Recovery</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="738" y1="348" x2="738" y2="368" stroke="#3F3F46" stroke-width="1.5"/>
  <polygon points="734,364 742,364 738,371" fill="#3F3F46"/>

  <!-- Stage 4 -->
  <rect x="594" y="372" width="288" height="92" rx="6" fill="#1C1C22" stroke="#26262E" stroke-width="1"/>
  <text x="608" y="392" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">4. Axum WS &amp; REST Router</text>
  <text x="608" y="410" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">WS   /ws , /api/v1/stream</text>
  <text x="608" y="426" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">GET  /api/v1/snapshot , /slots</text>
  <text x="608" y="442" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">GET  /api/v1/forks , /leaders</text>
  <text x="608" y="456" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">GET  /health , /api/v1/replay</text>
</svg>
